# 매일 또는 배포 웹의 갱신 버튼으로 나라장터 공고를 수집해 R2에 올린다.
name: collect

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00
  workflow_dispatch:
    inputs:
      begin:
        description: "수집 시작일(YYYY-MM-DD). 비우면 오늘과 이전 35일."
        default: ""
      end:
        description: "수집 종료일(YYYY-MM-DD). 비우면 오늘."
        default: ""

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      # 러너는 apis.data.go.kr에 TCP 연결이 되지 않는다. Worker 중계를 거친다.
      # (docs/이슈-Actions-수집-차단.md) 비워 두면 직접 호출로 되돌아가 다시 타임아웃난다.
      API_BASE: ${{ secrets.API_BASE }}
      RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          # ubuntu-latest tool cache에 있는 버전을 써 매 실행의 Node 20 다운로드를 피한다.
          node-version: "22"

      # 수집 범위를 먼저 정한다. 기본은 오늘과 이전 35일(양끝 포함 36일) — 나라장터는 지난
      # 공고를 소급 수정하므로 어제 하루만 받으면 그 사이 바뀐 건을 놓친다.
      - name: 수집 범위 결정
        id: range
        run: |
          BEGIN="${{ inputs.begin }}"
          END="${{ inputs.end }}"
          [ -n "$BEGIN" ] || BEGIN=$(date -u -d "35 days ago" +%Y-%m-%d)
          [ -n "$END" ] || END=$(date -u +%Y-%m-%d)
          echo "begin=$BEGIN" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "수집 범위 $BEGIN ~ $END"

      - name: 수집
        env:
          SYNC_BEGIN: ${{ steps.range.outputs.begin }}
          SYNC_END: ${{ steps.range.outputs.end }}
        run: node collector/collector.js --no-resume

      - name: 수집 실패 확인
        run: |
          COUNT=$(node -p "try{require('./data/sync-errors.json').length}catch{0}")
          echo "실패 작업 $COUNT건"
          [ "$COUNT" = "0" ] || { node -p "JSON.stringify(require('./data/sync-errors.json').slice(0,10),null,2)"; exit 1; }

      # collector는 Node 내장 모듈만 쓴다. 외부 패키지가 필요한 uploader 직전에 production
      # 의존성만 받고, dev tarball이 든 예전 setup-node 캐시는 복원하지 않는다.
      - name: 업로더 의존성 설치
        run: npm ci --omit=dev --no-audit --fund=false

      - name: 업로드
        env:
          SYNC_BEGIN: ${{ steps.range.outputs.begin }}
          SYNC_END: ${{ steps.range.outputs.end }}
        run: node uploader/upload.js --commit

      - name: 오류 로그 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-errors
          path: data/sync-errors.json
          if-no-files-found: ignore
          retention-days: 14
