# 매일 또는 배포 웹의 갱신 버튼으로 나라장터 공고를 수집해 R2에 올린다.
name: collect

on:
  schedule:
    - cron: "0 20 * * *" # UTC 20:00 = KST 05:00
  workflow_dispatch:
    inputs:
      begin:
        description: "수집 시작일(YYYY-MM-DD). 비우면 최근 35일."
        default: ""
      end:
        description: "수집 종료일(YYYY-MM-DD). 비우면 오늘."
        default: ""

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # 수집 범위를 먼저 정한다. 기본은 최근 35일 — 나라장터는 지난 공고를 소급 수정하므로
      # 어제 하루만 받으면 그 사이 바뀐 건을 놓친다.
      - name: 수집 범위 결정
        id: range
        run: |
          BEGIN="${{ inputs.begin }}"
          END="${{ inputs.end }}"
          [ -n "$BEGIN" ] || BEGIN=$(date -u -d "35 days ago" +%Y-%m-%d)
          [ -n "$END" ] || END=$(date -u +%Y-%m-%d)
          echo "begin=$BEGIN" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"
          echo "수집 범위 $BEGIN ~ $END"

      - name: 수집
        env:
          SYNC_BEGIN: ${{ steps.range.outputs.begin }}
          SYNC_END: ${{ steps.range.outputs.end }}
        run: node collector/collector.js --no-resume

      - name: 수집 실패 확인
        run: |
          COUNT=$(node -p "try{require('./data/sync-errors.json').length}catch{0}")
          echo "실패 작업 $COUNT건"
          [ "$COUNT" = "0" ] || { node -p "JSON.stringify(require('./data/sync-errors.json').slice(0,10),null,2)"; exit 1; }

      - name: 업로드
        env:
          SYNC_BEGIN: ${{ steps.range.outputs.begin }}
          SYNC_END: ${{ steps.range.outputs.end }}
        run: node uploader/upload.js

      - name: 오류 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-errors
          path: data/sync-errors.json
          if-no-files-found: ignore
          retention-days: 14
