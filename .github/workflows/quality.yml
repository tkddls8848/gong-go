name: service-quality

on:
  push:
  pull_request:
  workflow_dispatch:

# 검증 전용: 운영 시크릿·수집·R2 업로드·배포를 사용하지 않는다.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_CHANNEL: chromium
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Worker runtime and local R2 integration (no remote AI)
        run: npm run test:runtime
      - name: Known dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Worker bundle validation (no deployment)
        run: npx wrangler deploy --dry-run
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
      - name: Browser cookie lifecycle against local Worker (no remote AI)
        run: npm run test:runtime-browser
      - name: Desktop and mobile viewport regression (fixture APIs only)
        run: npm run test:browser
      - name: Synthetic large CSV search (no external data)
        run: npm run test:search-load
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
