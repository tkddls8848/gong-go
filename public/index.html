<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나라장터 공고 조회 웹</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <h1>나라장터 공고 조회 웹</h1>
        <div class="mode-toggle" id="mode-toggle" role="group" aria-label="공고 유형 선택">
          <button type="button" class="mode-toggle-btn active" data-mode="pre" aria-pressed="true">사전공고</button>
          <button type="button" class="mode-toggle-btn" data-mode="bid" aria-pressed="false">본공고</button>
          <button type="button" class="mode-toggle-btn" data-mode="plan" aria-pressed="false">발주계획</button>
        </div>
      </div>
      <p class="subtitle" id="app-subtitle">로컬 CSV에 저장한 사전공고를 조회합니다.</p>
    </header>

    <section class="panel">
      <h2>조회 조건</h2>
      <div class="data-status">
        <p class="data-range"><span class="data-range-label">보유 데이터</span><span id="data-range">확인하는 중입니다.</span><span id="data-count" class="data-count"></span><span id="last-crawl" class="data-crawl"></span></p>
        <button id="refresh-btn" class="secondary-btn" type="button">보유데이터 갱신</button>
      </div>
      <p id="refresh-status" class="refresh-status" hidden></p>
      <p id="status" class="hint">로컬 CSV를 불러오는 중입니다.</p>

      <div class="inst-section">
        <div class="inst-row" title="코드를 넣으면 코드 기준으로 정확히 조회합니다(본공고만 지원). 비우면 기관명이 정확히 일치하는 건만 남고, 모두 비우면 전체 기관을 조회합니다.">
          <span class="inst-label">관심 기관 <span id="inst-count" class="inst-count"></span></span>
          <input id="inst-name" class="inst-input-name" placeholder="기관명">
          <input id="inst-code" class="inst-input-code" placeholder="코드">
          <button id="add-row-btn" class="secondary-btn btn-sm" type="button">+ 추가</button>
          <div class="inst-tools"><button id="inst-search-btn" class="primary-btn btn-sm" type="button">관심 기관 검색</button><button id="clear-inst-btn" class="secondary-btn btn-sm" type="button">전체 비우기</button></div>
        </div>
        <div id="inst-chips" class="inst-chips"></div>
      </div>

      <div class="filter-row">
        <label class="filter-q">검색어<input id="q" placeholder="기관명, 공고번호, 사업명"></label>
        <label class="filter-type">업무구분<select id="business-type"><option value="">전체</option><option>물품</option><option>외자</option><option>용역</option><option>공사</option></select></label>
        <div class="filter-date"><span class="field-label">게시일</span><div class="date-pair"><input id="begin" class="date-input" type="date"><span class="date-sep">~</span><input id="end" class="date-input" type="date"></div></div>
        <div class="filter-actions"><button id="search" class="primary-btn" type="button">검색</button><button id="reset" class="secondary-btn" type="button">초기화</button></div>
      </div>
    </section>

    <section class="panel">
      <div class="results-header"><h2>조회 결과 <span id="result-summary"></span></h2><div class="download-actions"><button id="download-btn" class="secondary-btn" type="button" disabled>CSV로 다운로드</button><button id="download-ecr-btn" class="secondary-btn" type="button" disabled>ECR 펼쳐서 내보내기</button></div></div>
      <div class="table-scroll"><table><thead><tr><th>유형</th><th>공고번호</th><th>업무</th><th>수요기관</th><th>사업명(공고명)</th><th>게시일</th><th id="close-col">마감일</th></tr></thead><tbody id="results"></tbody></table></div>
      <div class="pagination"><button id="previous" class="secondary-btn" type="button">이전</button><span id="page-label">-</span><button id="next" class="secondary-btn" type="button">다음</button><label class="page-size">페이지당 <select id="page-size"><option>25</option><option selected>50</option><option>100</option><option>200</option><option>500</option></select> 건</label></div>
    </section>

    <footer class="page-footer"><span id="updated-at">updated -</span></footer>
  </div>
  <div id="file-modal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div class="modal-header"><h3 id="modal-title">첨부파일</h3><button id="modal-close" class="modal-close" type="button">&times;</button></div>
      <p class="hint" id="modal-subtitle"></p>
      <div class="modal-tabs"><button class="modal-tab active" data-tab="files" type="button">첨부파일</button><button id="ecr-tab" class="modal-tab" data-tab="ecr" type="button">ECR 규격</button></div>
      <div id="files-content"><ul id="modal-file-list" class="file-list"></ul><div class="modal-footer"><p class="hint">파일은 나라장터 서버에서 새 창으로 열립니다. 전체 다운로드를 사용하려면 팝업을 허용하세요.</p><button id="download-all-btn" class="primary-btn" type="button">전체 다운로드</button></div></div>
      <div id="ecr-content" hidden></div>
      <p class="modal-disclaimer">ECR 결과는 1차 참고용이며 최종 확인은 원문으로 해야 합니다.</p>
    </div>
  </div>
  <template id="empty-row"><tr><td colspan="7" class="empty">표시할 공고가 없습니다.</td></tr></template>
  <!-- rows.js는 app.js와 search-worker.js가 함께 쓰는 CSV 파서·행 모델이라 먼저 읽는다. -->
  <script src="rows.js"></script>
  <script src="app.js"></script>
</body>
</html>
